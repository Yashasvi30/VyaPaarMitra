<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VyapaarMitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Ol+Chiki:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width working column; on wide screens a second column shows how each sentence was understood */
  --ground:#EEF1F4; --surface:#FFFFFF; --ink:#14213D; --muted:#566277; --line:#D5DBE3;
  --sign:#1D46B0; --sign-ink:#FFFFFF; --accent:#1D46B0; --accent-ink:#FFFFFF;
  --marigold:#F4A40B; --marigold-ink:#2A1B00;
  --slip:#FFF4C2; --slip-ink:#2B2410; --slip-line:#DCCB7C;
  --good:#177245; --warn:#9A4A06; --bad:#B3261E;
  --display:"Baloo 2","Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Gujarati","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Sans Arabic","Noto Sans Ol Chiki",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#0D1322; --surface:#161E33; --ink:#E8ECF5; --muted:#9BA7BF; --line:#2A3554;
  --sign:#1B3A8F; --sign-ink:#FFFFFF; --accent:#9DB8FF; --accent-ink:#0D1322;
  --marigold:#F6B02E; --marigold-ink:#2A1B00; --slip:#2B2815; --slip-ink:#F3E7B0; --slip-line:#5A522A;
  --good:#5CCB8F; --warn:#F0A35E; --bad:#FF8A80;}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0D1322; --surface:#161E33; --ink:#E8ECF5; --muted:#9BA7BF; --line:#2A3554;
  --sign:#1B3A8F; --sign-ink:#FFFFFF; --accent:#9DB8FF; --accent-ink:#0D1322;
  --marigold:#F6B02E; --marigold-ink:#2A1B00; --slip:#2B2815; --slip-ink:#F3E7B0; --slip-line:#5A522A;
  --good:#5CCB8F; --warn:#F0A35E; --bad:#FF8A80;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
h1,h2,h3{text-wrap:balance}
small{font-size:.8125rem;color:var(--muted)}
.muted{color:var(--muted);font-size:.875rem}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1120px;margin:0 auto}
.top{background:var(--sign);color:var(--sign-ink);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top h1{font:700 1.5rem/1.1 var(--display);letter-spacing:.01em}
.top .tagp{font-size:.75rem;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:2px 10px;white-space:nowrap}
.top .sp{flex:1}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-width:0}
#langbtn{background:var(--marigold);color:var(--marigold-ink);border:0;border-radius:10px;min-height:44px;padding:6px 14px;font-weight:600}
.cols{overflow:auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px;align-content:start}
#view>section{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
#how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;margin:0 auto;width:100%}
#how.hidem{display:none}
#how h2{font:700 1.125rem/1.2 var(--display);margin-bottom:10px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.steps>li{counter-increment:s;position:relative;padding-inline-start:38px;display:flex;flex-direction:column;gap:4px;min-width:0}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .875rem/26px var(--body);text-align:center}
.steps h3{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:26px}
.steps pre{background:var(--ground);border-radius:8px;padding:10px;font:400 .75rem/1.45 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:0;max-height:240px}
.intent{font:700 1rem var(--body);color:var(--accent)}
.tag{font-size:.6875rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tok{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.875rem;background:var(--surface)}
.tok i{font-style:normal;font-size:.625rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tok.k{border-color:var(--accent)}.tok.k i{color:var(--accent)}.tok.s{opacity:.55}
.meter{position:relative;height:10px;border-radius:5px;background:var(--ground);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter span{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.speak{align-items:center;text-align:center}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badge{font-size:.8125rem;border-radius:99px;padding:3px 12px;border:1px solid var(--line);background:var(--surface)}
.badge.on{border-color:var(--good);color:var(--good)}.badge.off{color:var(--warn);border-color:var(--warn)}
.mic{width:132px;height:132px;border-radius:50%;border:0;background:var(--marigold);color:var(--marigold-ink);display:grid;place-items:center;box-shadow:0 0 0 8px color-mix(in srgb,var(--marigold) 22%,transparent)}
.mic.live{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--bad) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.micstate{font:600 1.125rem/1.3 var(--body);min-height:1.5em}
.privacy{font-size:.8125rem;color:var(--muted)}
.typef{display:flex;gap:8px;width:100%}
input[type=text],input[type=search],input[type=number],textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
textarea{resize:vertical;line-height:1.6}
.btn{min-height:48px;border-radius:10px;padding:8px 18px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn.go{background:var(--accent);color:var(--accent-ink)}.btn.go:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{min-height:44px;font-size:.875rem;align-self:center}
.optrow{width:100%;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;text-align:start;font-size:.875rem;color:var(--muted)}
.ck{display:flex;align-items:center;gap:8px;min-height:44px}.ck input{width:20px;height:20px;accent-color:var(--accent)}
.sel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
audio{width:100%;height:44px}
.trans{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.trans header{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--accent)}
.trans .full{font-size:1.0625rem;font-weight:600}
#say{width:100%;display:flex;flex-direction:column;gap:12px;text-align:start}
.heard{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.heard p{font-size:1.0625rem;min-width:0;overflow-wrap:anywhere}
.chipl{font-size:.75rem;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 10px;white-space:nowrap}
.reply{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-inline-start:4px solid var(--good);border-radius:8px;padding:10px 12px;font-weight:600;overflow-wrap:anywhere}
/* the bill slip: confirmation card drawn as a kirana cash memo */
.slip{background:var(--slip);color:var(--slip-ink);padding:14px 14px 22px;position:relative;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--slip-line)}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:linear-gradient(135deg,transparent 75%,var(--ground) 75%) 0 0/14px 10px,linear-gradient(225deg,transparent 75%,var(--ground) 75%) 0 0/14px 10px}
.slip header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--slip-ink);padding-bottom:6px}
.slip header b{font:700 1.25rem/1.2 var(--display)}
.slip header span{font-size:.8125rem;opacity:.75}
.cols4,.row{display:grid;grid-template-columns:minmax(0,1fr) 104px 56px 64px 32px;gap:6px;align-items:center}
.cols4{font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7;padding:6px 0 2px}
.cols4 span:nth-child(n+2),.row .q,.row .r,.row .a{text-align:center}
.row{padding:8px 0;border-bottom:1px dashed var(--slip-line)}
.row .nm{font-weight:600;overflow-wrap:anywhere}.row .nm small{display:block;color:inherit;opacity:.75}
.row .nm em{font-style:normal;font-weight:400;color:var(--warn)}
.row.ask{grid-template-columns:1fr;gap:8px}
.row .opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{display:flex;align-items:center;justify-content:center;gap:4px}
.st{width:32px;height:32px;border-radius:8px;border:1px solid var(--slip-ink);background:transparent;font-weight:700;line-height:1}
.x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;font-size:1.25rem;opacity:.7}
.tot{display:flex;justify-content:space-between;padding:10px 0 4px;font:700 1.125rem var(--body)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}.acts .btn{flex:1}
.slip .btn.ghost{border-color:var(--slip-ink);color:var(--slip-ink)}
.stamp{display:inline-block;margin:10px 0 4px;border:2px solid var(--good);color:var(--good);padding:2px 12px;font-weight:700;transform:rotate(-3deg);border-radius:4px}
.slip h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-top:6px}
.after li{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.neg{color:var(--bad);font-style:normal;font-size:.8125rem}
.chip{min-height:44px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;text-align:start;line-height:1.35}
.chip.num{min-width:48px;text-align:center}
.try{width:100%;text-align:start}.try h3{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:8px}
.plist,.log{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plist li,.log li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.plist li:last-child,.log li:last-child{border-bottom:0}
.plist li>div:first-child{min-width:0;display:flex;flex-direction:column}.plist b{overflow-wrap:anywhere}
.plist li.low{border-inline-start:4px solid var(--warn)}
.on{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;flex-shrink:0}.on b{font:700 1.375rem/1.1 var(--display)}
.pill{font-size:.6875rem;border-radius:99px;padding:1px 8px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-weight:600}
.pill.in{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.log li{flex-direction:column;align-items:stretch;gap:2px}.log li.void{opacity:.5;text-decoration:line-through}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.tiles b{font:700 1.75rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.addf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addf h3,.addf label:first-of-type,.addf .btn{grid-column:1/-1}.addf label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
.plist li.teach{flex-direction:column;align-items:stretch}.teachf{display:flex;gap:8px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:start;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr.cur td{background:color-mix(in srgb,var(--marigold) 18%,transparent)}
.lnk{background:none;border:0;padding:6px 0;min-height:44px;text-align:start}
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto}
#tabs button{flex:1 0 auto;min-width:64px;min-height:56px;padding:6px 10px;border:0;background:none;border-top:3px solid transparent;font-size:.8125rem;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
#tabs button.cur{color:var(--accent);border-top-color:var(--marigold)}
#tabs i{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;font-size:.6875rem;padding:0 6px;margin-inline-start:4px}
.foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8125rem;max-width:560px;margin:0 auto;width:100%}
.foot button{background:none;border:0;text-decoration:underline;color:inherit;min-height:44px}
.pick{position:fixed;inset:0;background:var(--sign);color:var(--sign-ink);overflow:auto;z-index:10}
.pickin{max-width:720px;margin:0 auto;padding:24px 16px 32px;display:flex;flex-direction:column;gap:14px}
.pick h1{font:700 2rem/1.1 var(--display)}.pick .sub{font-size:1.125rem}
.pick input{color:#14213D;background:#fff;border:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lgrid button{min-height:72px;border-radius:12px;border:2px solid transparent;background:#fff;color:#14213D;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:8px 14px;text-align:start}
.lgrid button b{font-size:1.25rem;line-height:1.4}.lgrid button small{color:#566277}
.lgrid button.cur{border-color:var(--marigold);background:#FFF4C2}
.pick .btn.ghost{border-color:rgba(255,255,255,.6);color:#fff;align-self:flex-start}
@media (min-width:960px){
  .cols{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}
  #view>section{margin:0}#how,#how.hidem{display:block;max-width:none;margin:0;position:sticky;top:0}
  .foot{max-width:none}
}
@media (max-width:400px){.cols4,.row{grid-template-columns:minmax(0,1fr) 96px 44px 56px 28px}.mic{width:116px;height:116px}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand"><h1>VyapaarMitra</h1><span class="tagp">Prototype · sample data</span></div><span class="sp"></span><button id="langbtn" data-act="openpick" aria-label="Change language"></button></header>
  <div class="cols"><main id="view"></main><aside id="how" aria-label="How it understood"></aside>
    <div class="foot"><span>Technology should adapt to the retailer, not the retailer to the technology.</span><button id="resetbtn" data-act="reset"></button></div></div>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="picker"></div>
<script>
/* VyapaarMitra data: language packs + seed catalogue */
const UI_KEYS=['t_speak','t_stock','t_today','t_reorder','t_cat','t_lang','tap','listening','type','audio','try','confirm','cancel','undo','which','howmany','repeat','notfound','add','saved','bought','undone','now','left','rate','todaySum','low','order','copy','copied','voiceOk','textOnly','reset','none','search','teach','save','choose','allgood','orderMsg','total','qty','sale','purchase','name','priceL','opening','send','lowCount'];
const P={};
P.en={n:'English',e:'English',loc:'en-IN',sc:'Latn',lvl:'Full',fb:['hi'],compound:1,
num:'1 one|2 two|3 three|4 four|5 five|6 six|7 seven|8 eight|9 nine|10 ten|11 eleven|12 twelve|13 thirteen|14 fourteen|15 fifteen|16 sixteen|17 seventeen|18 eighteen|19 nineteen|20 twenty|30 thirty|40 forty|50 fifty|60 sixty|70 seventy|80 eighty|90 ninety|100 hundred|0.5 half|0.25 quarter',
k:{sale:'sold sell sale selling',buy:'bought received purchased purchase arrived restock restocked came',stock:'stock left remaining have',price:'price rate cost',sum:'today total summary',reorder:'reorder order',q:'how',and:'and plus',rs:'rupe rs inr',attr:'',stop:'of the a an is are in many much what for to i we you it did does was were there please at each per with my our us me should need'},
ui:["Speak","Stock","Today","Reorder","Items","Languages","Tap and speak","Listening…","Or type here","Audio is not stored","Try saying","Confirm","Cancel","Undo last entry","Which one?","How many?","Sorry, I did not understand. Please say it again.","Not in the list","Add item","Sale recorded.","Stock added.","Last entry undone.","Stock now","{p}: {n} left","Rate","Today: {n} sales, ₹{v}","Low stock","Order","Copy order for WhatsApp","Copied","Voice + text","Text only in this browser","Reset demo","Nothing yet","Search item","Teach a new name","Save","Choose your language","Nothing to reorder","Namaste, please send:","Total","Qty","Sale","Stock received","Item name","Price","Opening stock","Send","{n} items are low"],
ex:["sold three ten rupee Maggi and two Coke","how many Maggi are left?","received five cartons of Parle-G","what did we sell today?","what is the price of Coke?","what should I reorder?"]};
P.hi={n:'हिन्दी',e:'Hindi',loc:'hi-IN',sc:'Deva',lvl:'Full',fb:['en'],

    <div class="optrow"><label class="ck"><input type="checkbox" id="keeprec" ${S.keepAudio?'checked':''}> ${esc(t('keepRec'))}</label>
      <label class="sel">${esc(t('trTo'))} <select id="trsel"><option value="">—</option>${LANG_ORDER.filter(c=>c!=='hg').map(c=>`<option value="${c}" ${S.trTo===c?'selected':''}>${esc(P[c].n)} · ${esc(P[c].e)}</option>`).join('')}</select></label></div>
    <div id="say">${V.heard?`<div class="heard"><p dir="auto">“${esc(V.heard.text)}”</p><span class="chipl">${esc(V.lastPr.lang)}</span></div>`:''}
      ${V.clip&&V.heard?`<audio controls src="${V.clip}" aria-label="${esc(t('keepRec'))}"></audio>`:''}
      ${V.tr&&V.heard?`<div class="trans"><header><b>${esc(P[V.tr.to].n)}</b>${ttsVoice(V.tr.to)?`<button class="btn ghost small" data-act="saytr" aria-label="Play translation">▶</button>`:''}</header>
        ${V.tr.full?`<p class="full" dir="auto">${esc(V.tr.full)}</p><small>${esc(V.tr.engine)}</small>`:V.tr.busy?'<p class="muted">…</p>':V.tr.to!==srcLang(V.heard.text,lang())?'<small>Word-for-word translation is not available on this page. The meaning below is built from what the app understood.</small>':''}
        ${V.tr.gloss?`<p dir="auto"><small>${esc(ui(V.tr.to,'meaning'))}</small> ${esc(V.tr.gloss)}</p>`:''}</div>`:''}
      ${slip()}${V.reply?`<p class="reply" dir="auto">${esc(V.reply)}</p>`:''}
      ${canUndo&&!V.pr?`<button class="btn ghost small" data-act="undo">${esc(t('undo'))}</button>`:''}</div>
    <div class="try"><h3>${esc(t('try'))}</h3><div class="chips">${(p.ex||P[p.fb[0]].ex||P.hi.ex).map(e=>`<button class="chip" dir="auto" data-act="ex" data-x="${esc(e)}">${esc(e)}</button>`).join('')}</div></div></section>`;}
function viewHow(){const pr=V.lastPr;
  if(!pr)return `<h2>How it understood</h2><p class="muted">Speak or tap an example. Each step from speech to stock update appears here.</p><ol class="steps">${['Speech','Meaning','Product','Transaction','Business action'].map(s=>`<li><h3>${s}</h3></li>`).join('')}</ol>`;
  const c=pr.conf,st=pr.status,done=V.done&&V.done.pr===pr;
  const json=JSON.stringify({parse_id:pr.id,intent:pr.intent,language_detected:pr.lang,items:pr.items.map(i=>({mention:i.mention,qty:i.cases!=null?i.cases+' case':i.qty,unit_price:i.price,sku_id:i.sku||null,match_score:i.picked?1:(i.score||0),candidates:(i.cands||[]).length>1?i.cands.map(x=>x.sku):undefined})),overall_confidence:c.C,status:st},null,1);
  const act=done?V.done.res.changes.map(x=>`${esc(x.sku)}: ${inr(x.before)} → ${inr(x.after)}`).join('<br>')+'<br><span class="muted">Written as signed inventory movements under one entry.</span>'
    :st==='READY'?'Waiting for the owner to tap Confirm. Nothing is written until then.':st==='NEEDS_CLARIFICATION'?'Paused. A short question is shown instead of guessing.':st==='ANSWER'?'Read-only query. Stock is not changed.':'Asked the owner to repeat.';
  return `<h2>How it understood</h2><ol class="steps">
   <li><h3>Speech</h3><p dir="auto">“${esc(pr.transcript)}”</p><p class="muted">${esc(V.heard.src)} · detected ${esc(pr.lang)} · ASR confidence ${c.asr}</p></li>
   <li><h3>Meaning</h3><p><b class="intent">${pr.intent}</b> <span class="tag">Rules</span></p><div class="toks">${pr.tokens.map(k=>`<span class="tok ${k.t==='W'?'w':k.t==='STOP'||k.t==='MITRA'?'s':'k'}" dir="auto">${esc(k.x)}<i>${k.t==='W'?'word':k.t==='NUM'?k.v:k.t.toLowerCase()}</i></span>`).join('')}</div></li>
   <li><h3>Product</h3>${pr.items.length?pr.items.map(i=>`<p dir="auto">“${esc(i.mention||'')}” → ${i.sku?`<b>${esc(i.sku)}</b> ${i.picked?'1.00 (chosen by owner)':i.score}`:'no match'}<br><span class="muted">${esc(i.how||'')}${i.why?' · '+esc(i.why):''}${(i.cands||[]).length>1?' · candidates '+i.cands.map(x=>x.sku.replace('SKU-','')+' '+(Math.round(x.s*100)/100)).join(', '):''}</span></p>`).join(''):'<p class="muted">No product needed.</p>'}</li>
   <li><h3>Transaction</h3><pre>${esc(json)}</pre><p class="muted">C = 0.2 × ${c.asr} + 0.3 × ${c.parse} + 0.5 × ${c.sku} = <b>${c.C}</b></p><div class="meter"><i style="width:${Math.round(c.C*100)}%"></i><span style="left:50%"></span><span style="left:85%"></span></div><p class="muted">Below 0.50 ask to repeat · 0.85 and above show the confirm card</p></li>
   <li><h3>Business action</h3><p>${act}</p></li></ol>`;}
function viewStock(){const q=V.q.trim().toLowerCase();
  const list=S.products.filter(p=>{if(!q)return true;const F=famOf(S,p.fam);return Object.values(F).join('|').toLowerCase().includes(q)||p.id.toLowerCase().includes(q);});
  return `<section><input id="q" class="search" type="search" value="${esc(V.q)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}">
   <ul class="plist">${list.map(p=>{const on=stockOf(S,p.id),low=on<=p.ro;return `<li class="${low?'low':''}"><div><b>${L(p)}</b><small><bdi>₹${inr(p.price)}</bdi> · <bdi>${esc(p.id)}</bdi></small></div><div class="on"><b>${inr(on)}</b>${low?`<span class="pill">${esc(t('low'))}</span>`:''}<small>↻ ${p.ro}</small></div></li>`;}).join('')||`<li class="muted">${esc(t('none'))}</li>`}</ul></section>`;}
function viewToday(){const s=daySummary(S,dayStart());const log=[...S.txns].reverse();
  return `<section><div class="tiles"><div><small>${esc(t('sale'))}</small><b>₹${inr(s.v)}</b></div><div><small>${esc(t('t_today'))}</small><b>${s.n}</b></div></div>
   ${s.top.length?`<ul class="plist">${s.top.map(([id,n])=>`<li><div><b>${L(prodById(S,id))}</b></div><div class="on"><b>${inr(n)}</b></div></li>`).join('')}</ul>`:''}
   <ul class="log">${log.map(x=>`<li class="${x.void?'void':''}"><div><span class="pill ${x.type==='SALE'?'':'in'}">${esc(t(x.type==='SALE'?'sale':'purchase'))}</span> <small>${new Date(x.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${esc(x.lang)}${x.void?' · undone':''}</small></div><p dir="auto">“${esc(x.text)}”</p><small>${x.items.map(i=>L(prodById(S,i.sku))+' × '+inr(i.qty)).join(', ')}${x.type==='SALE'?' · ₹'+inr(x.total):''}</small></li>`).join('')||`<li class="muted">${esc(t('none'))}</li>`}</ul>
   ${S.txns.some(x=>!x.void)?`<button class="btn ghost small" data-act="undo">${esc(t('undo'))}</button>`:''}</section>`;}
function viewReorder(){const low=lowList(S);
  V.orderText=t('orderMsg')+'\n'+low.map(x=>'• '+label(S,x.p,lang())+' × '+inr(x.sug)).join('\n');
  return `<section>${low.length?`<ul class="plist">${low.map(x=>`<li class="low"><div><b>${L(x.p)}</b><small>${esc(t('now'))}: ${inr(x.on)} · ↻ ${x.p.ro}</small></div><div class="on"><small>${esc(t('order'))}</small><b>${inr(x.sug)}</b></div></li>`).join('')}</ul>
   <textarea id="ordertxt" readonly rows="${low.length+1}" dir="auto" aria-label="${esc(t('copy'))}">${esc(V.orderText)}</textarea>
   <button class="btn go" data-act="copy">${esc(V.copied?t('copied'):t('copy'))}</button>`:`<p class="muted">${esc(t('allgood'))}</p>`}</section>`;}
function viewCat(){return `<section><form id="addf" class="addf"><h3>${esc(t('add'))}</h3>
   <label>${esc(t('name'))}<input id="np_name" type="text" required value="${esc(V.newName)}" dir="auto"></label>
   <label>${esc(t('priceL'))} ₹<input id="np_price" type="number" min="0" step="0.5" required inputmode="decimal"></label>
   <label>${esc(t('opening'))}<input id="np_open" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
   <button class="btn go" type="submit">${esc(t('save'))}</button></form>
   <ul class="plist">${S.products.map(p=>`<li class="teach"><div><b>${L(p)}</b><small>${esc(Object.values(famOf(S,p.fam)).map(x=>x.split('|')[0]).slice(0,6).join(' · '))}</small></div>
     <form class="teachf" data-fam="${esc(p.fam)}"><input type="text" id="al_${esc(p.id)}" placeholder="${esc(t('teach'))}" aria-label="${esc(t('teach'))}" dir="auto"><button class="btn ghost small" type="submit">${esc(t('save'))}</button></form></li>`).join('')}</ul></section>`;}
function viewLang(){const eng=engine();
  return `<section><p class="muted">Voice in is tested when you first speak in a language. Voice out needs a matching system voice. Text works for every language.${eng==='dictation'?' Voice in here uses Claude dictation.':eng?'':' This page cannot use the microphone here, so every language is text only.'}</p>
   <div class="tblwrap"><table><thead><tr><th>Language</th><th>Pack</th><th>Voice in</th><th>Voice out</th><th>Text</th></tr></thead><tbody>
   ${LANG_ORDER.map(c=>{const p=P[c];return `<tr class="${c===lang()?'cur':''}"><td><button class="lnk" data-act="setlang" data-c="${c}"><b>${esc(p.n)}</b> <small>${esc(p.e)}</small></button></td><td>${p.lvl}</td><td>${!eng?'No':S.voiceFail[c]?'No':'Try'}</td><td>${ttsVoice(c)?'Yes':'No'}</td><td>Yes</td></tr>`;}).join('')}</tbody></table></div>
   <p class="muted">Full: every screen, reply and example in the language. Partial: numbers and core words in the language, other screens in a related language. Basic: numbers only.</p>
   <button class="btn ghost small" data-act="reset">${esc(t('reset'))}</button></section>`;}
function picker(){const q=V.pickQ.trim().toLowerCase();
  return `<div class="pick" role="dialog" aria-modal="true" aria-label="Choose your language"><div class="pickin"><h1>VyapaarMitra</h1><p class="sub">${S.lang?esc(t('choose')):'अपनी भाषा चुनें · Choose your language'}</p>
   <input id="pickq" type="search" placeholder="Search · खोजें" value="${esc(V.pickQ)}" aria-label="Search languages">
   <div class="lgrid">${LANG_ORDER.filter(c=>!q||P[c].e.toLowerCase().includes(q)||P[c].n.toLowerCase().includes(q)).map(c=>`<button data-act="setlang" data-c="${c}" class="${c===S.lang?'cur':''}"><b dir="auto">${esc(P[c].n)}</b><small>${esc(P[c].e)}</small></button>`).join('')}</div>
   ${S.lang?`<button class="btn ghost" data-act="closepick">${esc(t('cancel'))}</button>`:''}</div></div>`;}
function paintMic(){const m=$('#micstate');if(m)m.textContent=V.interim||t('listening');}
function render(){const p=P[lang()];document.documentElement.lang=p.loc.split('-')[0];document.documentElement.dir=p.dir||'ltr';
  $('#langbtn').innerHTML=`<b>${esc(p.n)}</b>`;
  const tabs=[['speak','t_speak'],['stock','t_stock'],['today','t_today'],['reorder','t_reorder'],['cat','t_cat'],['lang','t_lang']];
  const lowN=lowList(S).length;
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-k="${k}" class="${V.tab===k?'cur':''}" ${V.tab===k?'aria-current="page"':''}>${esc(t(l))}${k==='reorder'&&lowN?`<i>${lowN}</i>`:''}</button>`).join('');
  $('#view').innerHTML=({speak:viewSpeak,stock:viewStock,today:viewToday,reorder:viewReorder,cat:viewCat,lang:viewLang})[V.tab]();
  $('#how').innerHTML=viewHow();$('#how').className=V.tab==='speak'?'':'hidem';
  $('#picker').innerHTML=V.picker?picker():'';$('#resetbtn').textContent=t('reset');}
/* ---- events ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,pr=V.pr;
  if(a==='mic')return micClick();
  if(a==='tab'){V.tab=b.dataset.k;V.copied=false;}
  else if(a==='ex')return handle(b.dataset.x,1,'Example phrase');
  else if(a==='openpick'){V.picker=true;V.pickQ='';}
  else if(a==='closepick')V.picker=false;
  else if(a==='saytr'){if(V.tr)speak(V.tr.full||V.tr.gloss,V.tr.to);return;}
  else if(a==='setlang'){S.lang=b.dataset.c;V.picker=false;V.pr=null;V.done=null;V.reply='';V.heard=null;V.lastPr=null;V.note='';V.tr=null;save();}
  else if(a==='pick'&&pr){const it=pr.items[i];it.sku=b.dataset.sku;it.picked=true;score(pr);const q=question(pr);if(q)speak(q);}
  else if(a==='qty'&&pr){const it=pr.items[i];it.qty=+b.dataset.n;if(it.cs)it.cases=it.qty;score(pr);}
  else if(a==='step'&&pr){const it=pr.items[i],n=Math.max(1,(it.cases!=null?it.cases:it.qty)+(+b.dataset.d));it.qty=n;if(it.cases!=null)it.cases=n;score(pr);}
  else if(a==='rm'&&pr){pr.items.splice(i,1);if(!pr.items.length)V.pr=null;else score(pr);}
  else if(a==='addprod'&&pr){V.newName=pr.items[i].mention;V.tab='cat';}
  else if(a==='cancel'){V.pr=null;V.reply='';}
  else if(a==='confirm')return confirmTxn();
  else if(a==='undo'){if(undo(S)){V.done=null;V.pr=null;V.reply=t('undone');speak(V.reply);save();}}
  else if(a==='reset'){const l=S.lang,k=S.keepAudio,tt=S.trTo;S=newState();S.lang=l;S.keepAudio=k;S.trTo=tt;V.tr=null;Object.assign(V,{pr:null,done:null,reply:'',heard:null,lastPr:null,q:'',newName:''});save();}
  else if(a==='copy'){const done=()=>{V.copied=true;render();};try{navigator.clipboard.writeText(V.orderText).then(done,()=>{const x=$('#ordertxt');x.focus();x.select();});}catch(err){const x=$('#ordertxt');x.focus();x.select();}return;}
  render();});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='typef'){const v=$('#typed').value;if(v.trim())handle(v,1,'Typed');}
  else if(f.id==='addf'){const name=$('#np_name').value.trim(),price=parseFloat($('#np_price').value),open=parseFloat($('#np_open').value)||0;if(!name||isNaN(price))return;
    const id='SKU-NEW-'+(S.products.length+1),fam='x'+id;S.fams[fam]={[scriptOf(name)==='Latn'?'Latn':scriptOf(name)]:name,Latn:scriptOf(name)==='Latn'?name+'|'+name.toLowerCase():name};
    S.products.push({id,fam,pack:'',price,open,ro:Math.max(2,Math.ceil(open/3)),cs:12,d:1});buildIndex(S);V.newName='';save();
    if(V.heard&&V.lastPr&&V.lastPr.items.some(i=>i.status==='none')){V.tab='speak';return handle(V.heard.text,V.lastPr.conf.asr,V.heard.src);}render();}
  else if(f.classList.contains('teachf')){const inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;S.aliases.push({fam:f.dataset.fam,text:v});buildIndex(S);save();inp.value='';inp.placeholder='✓ '+v;}});
document.addEventListener('change',e=>{if(e.target.id==='keeprec'){S.keepAudio=e.target.checked;if(!S.keepAudio&&V.clip){URL.revokeObjectURL(V.clip);V.clip=null;}save();render();}
  if(e.target.id==='trsel'){S.trTo=e.target.value;translateNow();save();render();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;const pos=e.target.selectionStart;render();const x=$('#q');x.focus();try{x.setSelectionRange(pos,pos);}catch(err){}}
  if(e.target.id==='pickq'){V.pickQ=e.target.value;const pos=e.target.selectionStart;render();const x=$('#pickq');x.focus();try{x.setSelectionRange(pos,pos);}catch(err){}}});
buildIndex(S);render();
</script>
</body>
</html>
